version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - user
      - core

  user:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - core

  core:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
