server:
  port: 8081

spring:
  application:
    name: user

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  logging:
    level:
      root: INFO
      com.kh.sbilyhour.user_service: DEBUG
